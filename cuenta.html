<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - CryptoSim</title>
    <link rel="icon" type="image/png" href="bitcoin.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="cuenta.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-brands fa-bitcoin"></i> CryptoSim</a>
            <a class="navbar-brand" href="simulador.html"><i class="fa-solid fa-magnifying-glass-chart"></i> Simulador</a>
            <a class="navbar-brand" href="cuenta.html"><i class="fa-solid fa-user"></i> Cuenta</a>
            <a class="navbar-brand" href="contacto.html"><i class="fa-solid fa-phone"></i> Contacto</a>
        </div>
    </nav>

    <div class="container mt-5">
        
        <div id="profile-view" class="row g-4">
            
            <div class="col-md-4">
                <div class="profile-card">
                    
                    <img id="user-photo" src="guest-avatar.png" alt="Invitado" class="profile-img">
                    
                    <div id="info-usuario" style="display: none;">
                        <h4 id="user-name" class="text-white">Cargando...</h4>
                        <p id="user-email" class="text-muted small">...</p>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                            </button>
                        </div>
                    </div>

                    <div id="info-invitado">
                        <h4 class="text-white">Modo Invitado</h4>
                        <p class="text-white small">Tus datos se guardan solo en este dispositivo.</p>
                        
                        <div class="d-grid gap-2 mt-4">
                            <button class="google-btn" onclick="iniciarSesionGoogle()" style="font-size: 0.9rem; justify-content: center; display: flex; align-items: center;">
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18" class="me-2"> Iniciar sesión</button>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-2">
                        <button class="btn btn-outline-danger btn-sm" onclick="resetearApp()">
                            <i class="fas fa-trash-alt"></i> Resetear Cuenta
                        </button>
                    </div>

                </div>
            </div>

            <div class="col-md-8">
                <div class="wallet-card">
                    <h5 class="text-white mb-2"><i class="fas fa-chart-pie"></i> Patrimonio Total Estimado</h5>
                    <h1 class="display-4 text-warning fw-bold mb-3" id="patrimonio-cuenta-live">...</h1>
                    
                    <p class="text-white mb-4">
                        Saldo Disponible (USD): <span id="saldo-cuenta-fijo" class="fw-bold text-success">...</span>
                    </p>
                    
                    <div class="d-flex gap-3">
                        <button class="btn btn-success flex-grow-1 py-3 fw-bold" onclick="gestionarFondos('ingresar')">
                            <i class="fas fa-arrow-up"></i> Ingresar
                        </button>
                        <button class="btn btn-danger flex-grow-1 py-3 fw-bold" onclick="gestionarFondos('retirar')">
                            <i class="fas fa-arrow-down"></i> Retirar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.12/sweetalert2.all.min.js"></script>
    
    <script src="script.js"></script>
    <script src="auth-config.js"></script>
    
    <script>
        // Lógica visual de botones de cuenta
        async function gestionarFondos(accion) {
            const esIngreso = accion === 'ingresar';
            const titulo = esIngreso ? 'Ingresar Fondos' : 'Retirar Fondos';
            const color = esIngreso ? '#0ecb81' : '#f6465d';

            const { value: cantidad } = await Swal.fire({
                title: titulo,
                text: esIngreso ? '¿Cuánto quieres añadir?' : '¿Cuánto quieres retirar?',
                input: 'number',
                inputAttributes: { min: '0.01', step: 'any' },
                showCancelButton: true,
                confirmButtonText: esIngreso ? 'Depositar' : 'Retirar',
                confirmButtonColor: color,
                background: '#181a20', color: '#eaecef',
                inputValidator: (value) => {
                    if (!value || parseFloat(value) <= 0) return 'Cantidad no válida';
                }
            });

            if (cantidad) {
                const valor = parseFloat(cantidad);
                if (!esIngreso && valor > saldoUsuario) {
                    return Swal.fire({ icon: 'error', title: 'Fondos insuficientes', background: '#181a20', color: '#eaecef' });
                }
                
                if (esIngreso) saldoUsuario += valor;
                else saldoUsuario -= valor;

                guardarDatos(); 
                
                Swal.fire({
                    icon: 'success', title: 'Exitosa', text: `Nuevo saldo: ${formatearDinero(saldoUsuario)}`,
                    background: '#181a20', color: '#eaecef', timer: 2000, showConfirmButton: false
                });
            }
        }
    </script>
</body>
</html>
