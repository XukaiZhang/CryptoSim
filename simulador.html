<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Trading - CryptoSim</title>
    <link rel="icon" type="image/png" href="bitcoin.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="trading.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-brands fa-bitcoin"></i> CryptoSim</a>
            <a class="navbar-brand" href="simulador.html"><i class="fa-solid fa-magnifying-glass-chart"></i> Simulador</a>
            <a class="navbar-brand" href="cuenta.html"><i class="fa-solid fa-user"></i> Cuenta</a>
            <a class="navbar-brand" href="contacto.html"><i class="fa-solid fa-phone"></i> Contacto</a>
        </div>
    </nav>

    <div id="loader" style="display: none;">
        <div class="spinner-border text-warning"></div>
        <p class="mt-3">Cargando mercado...</p>
    </div>

    <div class="trading-layout">
        
        <div class="trading-header">
            <select id="selector-cripto" class="crypto-selector">
                </select>
            
            <div class="precio-header" id="precio-header">$0.00</div>
            <div class="cambio-header cambio-positivo" id="cambio-header">+0.00%</div>
            
            <div class="ms-auto">
                <button class="btn btn-sm btn-outline-warning" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i> Inicio
                </button>
            </div>
        </div>
        
        <div class="orderbook-panel">
            <h6 class="mb-3">Mis Órdenes</h6>
            
            <div class="orderbook-header">
                <span>Tipo</span>
                <span>Precio</span>
                <span>Cant.</span>
            </div>
            
            <div id="historial-panel-izquierdo">
                <p class="text-muted text-center small mt-4">No hay órdenes recientes</p>
            </div>
        </div>
        
        <div class="chart-main">
            <div class="chart-controls">
                <button class="btn-timeframe active" onclick="cambiarTemporalidadBinance('30m')">30m</button>
                <button class="btn-timeframe" onclick="cambiarTemporalidadBinance('1h')">1H</button>
                <button class="btn-timeframe" onclick="cambiarTemporalidadBinance('4h')">4H</button>
                <button class="btn-timeframe" onclick="cambiarTemporalidadBinance('1d')">Diario</button>
                <button class="btn-timeframe" onclick="cambiarTemporalidadBinance('1w')">Semanal</button>
            </div>
            
            <div class="chart-container-trading">
                <div id="chartTrading" style="width: 100%; height: 100%;"></div>
            </div>
        </div>
        
        <div class="trading-panel-right">
            <h6 class="mb-3">Trading</h6>
            
            <div class="balance-info">
                <div class="balance-row">
                    <span class="balance-label">Saldo disponible:</span>
                    <span class="balance-value" id="saldo-disponible">$10,000.00</span>
                </div>
                
                <div class="balance-row">
                    <span class="balance-label">Patrimonio Total:</span>
                    <span class="balance-value text-primary fw-bold" id="balance-total-cuenta">$10,000.00</span>
                </div>

                <hr style="border-color: #484d56; margin: 10px 0;">

                <div class="balance-row">
                    <span class="balance-label">Holdings (<span id="simbolo-holding">BTC</span>):</span>
                    <span class="balance-value" id="holdings-actual">0.000000</span>
                </div>
                <div class="balance-row">
                    <span class="balance-label">Valor en USD:</span>
                    <span class="balance-value text-success" id="valor-total">$0.00</span>
                </div>
            </div>
            
            <div class="mb-4">
                <h6 class="text-success mb-3">Comprar</h6>
                <div class="input-group-exchange">
                    <label>Precio (USD)</label>
                    <input type="number" id="precio-compra" placeholder="Precio actual" readonly>
                </div>
                <div class="input-group-exchange">
                    <label>Cantidad</label>
                    <input type="number" id="cantidad-compra" placeholder="0.00000000" step="0.00000001">
                </div>
                <div class="input-group-exchange">
                    <label>Total (USD)</label>
                    <input type="number" id="total-compra" placeholder="0.00">
                </div>
                <button class="btn-buy-exchange" onclick="ejecutarCompraRapida()">
                    Comprar <span id="simbolo-compra">BTC</span>
                </button>
            </div>
            
            <div>
                <h6 class="text-danger mb-3">Vender</h6>
                <div class="input-group-exchange">
                    <label>Precio (USD)</label>
                    <input type="number" id="precio-venta" placeholder="Precio actual" readonly>
                </div>
                <div class="input-group-exchange">
                    <label>Cantidad</label>
                    <input type="number" id="cantidad-venta" placeholder="0.00000000" step="0.00000001">
                </div>
                <div class="input-group-exchange">
                    <label>Total (USD)</label>
                    <input type="number" id="total-venta" placeholder="0.00">
                </div>
                <button class="btn-sell-exchange" onclick="ejecutarVentaRapida()">
                    Vender <span id="simbolo-venta">BTC</span>
                </button>
            </div>
        </div>
    </div> 

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.12/sweetalert2.all.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>

    <script src="auth-config.js"></script>
</body>
</html>
