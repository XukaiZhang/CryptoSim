<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoSim - Simulador de Trading</title>

    <!-- Favion -->
    <link rel="icon" type="image/png" href="bitcoin.png">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">

    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <!-- Barra de navegación -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-brands fa-bitcoin"></i> CryptoSim</a>
            <a class="navbar-brand" href="simulador.html"><i class="fa-solid fa-magnifying-glass-chart"></i> Simulador</a>
            <a class="navbar-brand" href="mercado.html"><i class="fas fa-chart-line"></i> Mercado</a>
            <a class="navbar-brand" href="cuenta.html"><i class="fa-solid fa-user"></i> Cuenta</a>
            <a class="navbar-brand" href="contacto.html"><i class="fa-solid fa-phone"></i> Contacto</a>
        </div>
    </nav>


    <!-- Contenido principal -->
    <div class="container mt-5">

        <!-- Bienvenida -->
        <section id="inicio" class="text-center mb-5">
            <h1 class="display-4 mb-3">Bienvenido a CryptoSim</h1>
            <p class="lead">Tu solución integral para simulaciones de criptomonedas.</p>
        </section>

        <!-- Cartera del usuario -->
        <section id="cartera-section" class="mb-5">
            <div class="balance-cartera text-center">
                <h2 class="mb-3"><i class="fas fa-wallet"></i> Mi Cartera</h2>
                <div class="balance-cantidad" id="cartera">100,000.00 €</div>
                <button class="btn btn-outline-success mt-3">Agregar Fondos</button>
                <button class="btn btn-outline-danger mt-3">Retirar Fondos</button>
            </div>
        </section>

        <!-- Tabla de criptomonedas -->
        <section id="cripto-monedas" class="mb-5">
            <h2 class="mb-4"><i class="fas fa-coins"></i> Mercado de Criptomonedas</h2>

            <div class="tabla-cripto">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Criptomoneda</th>
                            <th>Precio Actual</th>
                            <th>Cambio (%)</th>
                            <th>Holdings</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-criptomonedas">
                        <!-- Las filas de las criptomonedas se agregarán aquí dinámicamente -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Gráfica de criptomonedas-->
        <section id="grafica" class="mb-5">
            <div class="container-grafica">
                <h2 class="mb-4"><i class="fas fa-chart-line"></i> Gráfica de Criptomonedas</h2>
                <canvas id="grafica-criptomonedas"></canvas>
            </div>
        </section>

    </div>

    <!-- Pie de página -->
    <footer class="text-center py-4 mt-5">
        <p class="text-muted">CryptoSim &copy; 2025 - Proyecto Educativo</p>
    </footer>

    <!-- Librerías externas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.3.0/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.7.12/sweetalert2.all.min.js"></script>

</body>
</html>
